services:
  - type: web
    name: dezignpool-website
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: 18
      # The Turnstile site key is intentionally not declared here. Until both
      # browser values are configured together, the form keeps its EmailJS path.
      - key: VITE_CRM_LEAD_ENDPOINT
        value: https://api.dezignpool.com/api/public/website-leads
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; frame-src https://challenges.cloudflare.com; connect-src 'self' https://api.emailjs.com https://api.cloudinary.com https://api.dezignpool.com https://dezignpool-crm.onrender.com https://challenges.cloudflare.com https://www.facebook.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
    routes:
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /services
        destination: /services.html
      - type: rewrite
        source: /projects
        destination: /projects.html
      - type: rewrite
        source: /calculator
        destination: /calculator.html
      - type: rewrite
        source: /interior-calculator
        destination: /interior-calculator.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /blog
        destination: /blog.html
      - type: rewrite
        source: /blog/*
        destination: /blog-*.html
      - type: rewrite
        source: /project/after-the-rain
        destination: /project-after-the-rain.html
      - type: rewrite
        source: /project/century-ethos
        destination: /project-century-ethos.html
      - type: rewrite
        source: /project/kolte-patil
        destination: /project-kolte-patil.html
      - type: rewrite
        source: /project/prestige-lakeridge
        destination: /project-prestige-lakeridge.html
      - type: rewrite
        source: /*
        destination: /index.html
